name: Artifact Folder Corrected

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate models folder
        run: python my_app.py

      - name: Verify generated files
        run: |
          ls -R

      - name: Upload models folder (preserve structure)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/**

  consume:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact into models folder
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: .

      - name: Verify downloaded files
        run: |
          ls -R

      - name: Read files
        run: |
          cat models/model.pkl
          cat models/metrics.json