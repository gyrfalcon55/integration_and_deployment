name: Artifact Folder Example

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate folder with files
        run: python my_app.py

      - name: Upload models folder
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  consume:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models

      - name: Show files
        run: |
          ls -R
          cat models/model.pkl
          cat models/metrics.json